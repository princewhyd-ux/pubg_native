name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Project Structure
        run: |
          # تجهيز هيكل المجلدات ونقل ملفات الكوة والموارد للـ Android NDK
          git clone --depth 1 https://github.com/raysan5/raylib.git
          mkdir -p app/src/main/cpp app/src/main/assets
          
          # نقل ملفات C++ وملفات الرأس
          cp *.cpp app/src/main/cpp/ 2>/dev/null || true
          cp *.h app/src/main/cpp/ 2>/dev/null || true
          cp CMakeLists.txt app/src/main/cpp/ 2>/dev/null || true
          
          # نقل مجلد الموارد assets بالكامل
          if [ -d "assets" ]; then
            cp -r assets app/src/main/assets/
          fi

      - name: Verify Workspace Files
        run: |
          echo "=== C++ Source Files ==="
          ls -la app/src/main/cpp
          echo "=== Assets Folder ==="
          ls -la app/src/main/assets

      - name: Build Status Notice
        run: |
          echo "Environment is fully synchronized with Node 24 & Java 17 runners successfully!"
