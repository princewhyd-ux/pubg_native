name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Install NDK
        run: sdkmanager "ndk;25.1.8937393"

      - name: Clone Raylib
        run: |
          git clone --depth=1 https://github.com/raysan5/raylib.git

      - name: Create Android Project
        run: |

          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp *.cpp app/src/main/cpp/ 2>/dev/null || true
          cp *.h app/src/main/cpp/ 2>/dev/null || true
          cp CMakeLists.txt app/src/main/cpp/

          cp -r raylib/src app/src/main/cpp/raylib_src

          if [ -d assets ]; then
            cp -r assets/* app/src/main/assets/
          fi

          cat > settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name="PUBGNative"
          include(":app")
          EOF

          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          EOF

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {

              namespace "com.pubg.nativegame"

              compileSdk 34

              defaultConfig {

                  applicationId "com.pubg.nativegame"

                  minSdk 24
                  targetSdk 34

                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3"
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              ndkVersion "25.1.8937393"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-feature
              android:glEsVersion="0x00020000"
              android:required="true"/>

          <application
              android:label="PUBG Native">

              <activity
                  android:name="android.app.NativeActivity"
                  android:exported="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <meta-data
                      android:name="android.app.lib_name"
                      android:value="pubg_native"/>

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>

              </activity>

          </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">PUBG Native</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Wrapper
        run: |
          gradle wrapper --gradle-version 8.3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
