name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 25.1.8937393
      CMAKE_VERSION: 3.22.1
      GRADLE_VERSION: 8.3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Download Gradle Wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip gradle-${GRADLE_VERSION}-bin.zip

      - name: Clone Raylib
        run: |
          git clone --depth=1 https://github.com/raysan5/raylib.git

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/pubg/nativegame
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

      - name: Copy Game Sources & Assets
        run: |
          cp *.cpp app/src/main/cpp/ 2>/dev/null || true
          cp *.c app/src/main/cpp/ 2>/dev/null || true
          cp *.h app/src/main/cpp/ 2>/dev/null || true
          cp *.hpp app/src/main/cpp/ 2>/dev/null || true

          if [ -d assets ]; then
              cp -r assets/* app/src/main/assets/
          fi

          cp -r raylib/src app/src/main/cpp/raylib_src
          mkdir -p app/src/main/cpp/raylib_src/external
          cp -r raylib/src/external/* app/src/main/cpp/raylib_src/external/

      - name: Auto-Fix C++ Incomplete Types (JS to C++ Porting Fix)
        run: |
          python3 -c '
          import os, re, glob
          
          cpp_files = glob.glob("app/src/main/cpp/*.cpp")
          h_files = glob.glob("app/src/main/cpp/*.h")
          
          for h_file in h_files:
              with open(h_file, "r") as f: h_data = f.read()
              modified = False
              
              # البحث عن الهياكل الناقصة مثل struct CarObject;
              fwds = re.findall(r"struct\s+([A-Za-z0-9_]+)\s*;", h_data)
              for struct_name in fwds:
                  for cpp_file in cpp_files:
                      with open(cpp_file, "r") as f: c_data = f.read()
                      
                      # سحب الهيكل الكامل من ملف cpp
                      pattern = r"(struct\s+" + struct_name + r"\s*\{.*?\};)"
                      match = re.search(pattern, c_data, re.DOTALL)
                      if match:
                          s_def = match.group(1)
                          # حذفه من الـ cpp لمنع التضارب
                          c_data = c_data.replace(s_def, f"/* {struct_name} moved to {os.path.basename(h_file)} */")
                          with open(cpp_file, "w") as f: f.write(c_data)
                          
                          # زرعه بشكل سليم في ملف الـ h
                          h_data = re.sub(r"struct\s+" + struct_name + r"\s*;", s_def, h_data)
                          modified = True
                          print(f"✅ Fixed C++ Architecture: Moved {struct_name} from {os.path.basename(cpp_file)} to {os.path.basename(h_file)}")
              
              if modified:
                  if "raymath.h" not in h_data:
                      h_data = "#include \"raymath.h\"\n" + h_data
                  with open(h_file, "w") as f: f.write(h_data)
          '

      - name: Create CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(pubg_native)

          set(CMAKE_CXX_STANDARD 17)
          add_definitions(-DPLATFORM_ANDROID -DGRAPHICS_API_OPENGL_ES2)

          include_directories(. raylib_src raylib_src/external/glfw/include)

          add_library(pubg_native SHARED
              main.cpp combat.cpp npc.cpp driving.cpp animations.cpp collision.cpp
              raylib_src/rcore.c raylib_src/rshapes.c raylib_src/rtextures.c
              raylib_src/rtext.c raylib_src/rmodels.c raylib_src/raudio.c
          )

          find_library(log-lib log)
          find_library(glesv-lib GLESv2)
          find_library(egl-lib EGL)
          find_library(android-lib android)
          find_library(m-lib m)

          target_link_libraries(pubg_native
              ${log-lib} ${glesv-lib} ${egl-lib} ${android-lib} ${m-lib}
          )
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PUBGNative"
          include(":app")
          EOF

      - name: Create Root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.1' apply false }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          org.gradle.configureondemand=true
          org.gradle.caching=true
          EOF

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> local.properties

      - name: Create gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download Gradle Wrapper JAR & gradlew
        run: |
          wget https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          wget https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew
          wget https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew.bat
          chmod +x gradlew

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.pubg.nativegame"
              compileSdk 34
              ndkVersion "25.1.8937393"
              defaultConfig {
                  applicationId "com.pubg.nativegame"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild { cmake { cppFlags "-std=c++17 -O3 -ffast-math" } }
              }
              buildTypes {
                  debug { debuggable true }
                  release { minifyEnabled false; shrinkResources false; debuggable false }
              }
              sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
          }
          dependencies { }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="PUBG Native" android:allowBackup="false" android:hardwareAccelerated="true" android:extractNativeLibs="true">
                  <activity android:name="android.app.NativeActivity" android:exported="true" android:screenOrientation="landscape" android:theme="@android:style/Theme.NoTitleBar.Fullscreen" android:configChanges="orientation|keyboardHidden|keyboard|screenLayout|screenSize|smallestScreenSize|uiMode">
                      <meta-data android:name="android.app.lib_name" android:value="pubg_native"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Resources
        run: |
          cat > app/src/main/res/values/strings.xml <<EOF
          <resources><string name="app_name">PUBG Native</string></resources>
          EOF

      - name: Build APK via Gradle
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Native-APK
          path: app/build/outputs/apk/debug/*.apk
