name: Build Native C++ Game

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Emscripten (C++ Compiler)
        uses: mymindstorm/setup-emsdk@v14

      - name: Build Raylib Engine for Web
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB -B

      - name: Compile Game (C++ to Native Binary)
        run: |
          mkdir -p build
          emcc main.cpp combat.cpp npc.cpp driving.cpp animations.cpp collision.cpp -o build/index.html -Os -Wall -Iraylib/src -Lraylib/src -lraylib -s USE_GLFW=3 -s ASYNCIFY -s INITIAL_MEMORY=134217728 -s FORCE_FILESYSTEM=1 --shell-file raylib/src/minshell.html --preload-file assets

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
