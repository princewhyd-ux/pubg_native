name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Archive Project Files and Assets
        run: |
          mkdir -p dist
          # ضغد كافة ملفات الكود ومجلد الموارد assets والملفات الهندسية في ملف واحد
          zip -r dist/pubg-native-game.zip *.cpp *.h assets/ CMakeLists.txt 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-native-package
          path: dist/pubg-native-game.zip
